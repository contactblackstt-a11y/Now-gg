<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    #blackout {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 99999;
      transition: opacity 1.5s ease-in-out;
    }
    #site-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="blackout"></div>
  <iframe 
    id="site-frame" 
    src="https://146.ip.nowgg.fun/apps/a/19900/b.html" 
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
    allowtransparency="true" 
    frameborder="0"
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
  ></iframe>
  <script>
    (function() {
      const MIN_TIME = 5000;
      const FADE = 1500;
      const start = Date.now();
      const blackout = document.getElementById('blackout');
      const frame = document.getElementById('site-frame');
      let done = false;

      function hide() {
        if (done) return;
        done = true;
        const wait = Math.max(0, MIN_TIME - (Date.now() - start));
        setTimeout(() => {
          blackout.style.opacity = '0';
          setTimeout(() => {
            if (blackout.parentNode) blackout.parentNode.removeChild(blackout);
          }, FADE);
        }, wait);
      }

      frame.addEventListener('load', hide);
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>

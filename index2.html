<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    #blackout {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 99999;
      transition: opacity 1.5s ease-in-out;
    }
    #site-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="blackout"></div>
  <div id="site-frame" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;background:#000;"></div>
  <script>
    (function() {
      'use strict';
      
      const TARGET_URL = "https://146.ip.nowgg.fun/apps/a/19900/b.html";
      const TOTAL_BLACKOUT = 10000;
      const LOAD_AT = 5000;
      const FADE = 1500;
      const start = Date.now();
      const blackout = document.getElementById('blackout');
      const container = document.getElementById('site-frame');
      let siteLoaded = false;
      let blackoutHidden = false;

      function loadSite() {
        if (siteLoaded) return;
        siteLoaded = true;
        
        try {
          const iframe = document.createElement('iframe');
          iframe.setAttribute('src', TARGET_URL);
          iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
          iframe.setAttribute('allowtransparency', 'true');
          iframe.setAttribute('frameborder', '0');
          iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms');
          iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;background:#000;';
          
          container.innerHTML = '';
          container.appendChild(iframe);
        } catch (e) {
          console.error('Erro ao carregar iframe:', e);
        }
      }

      function hideBlackout() {
        if (blackoutHidden) return;
        blackoutHidden = true;
        
        const elapsed = Date.now() - start;
        const wait = Math.max(0, TOTAL_BLACKOUT - elapsed);
        
        setTimeout(function() {
          if (blackout && blackout.style) {
            blackout.style.opacity = '0';
            setTimeout(function() {
              if (blackout && blackout.parentNode) {
                blackout.parentNode.removeChild(blackout);
              }
            }, FADE);
          }
        }, wait);
      }

      // Carrega o site no meio do tempo (5 segundos)
      setTimeout(loadSite, LOAD_AT);

      // Esconde a tela preta após o tempo total (10 segundos)
      setTimeout(hideBlackout, TOTAL_BLACKOUT);
    })();
  </script>
</body>
</html>
